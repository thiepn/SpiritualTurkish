name: Apply SpiritualTurkish P15 beta candidate v3
'on':
  workflow_dispatch: null
  push:
    branches:
    - release/p15-beta-final
permissions:
  contents: write
  pull-requests: write
jobs:
  apply-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install project dependencies
      run: npm ci --ignore-scripts
    - name: Install Chromium
      run: npx playwright install --with-deps chromium
      continue-on-error: true
    - name: Recover cumulative P15 payload
      shell: python
      run: "from pathlib import Path\nimport base64, zipfile\n\nsrc = Path(\".github/workflows/manual-p15-beta.yml\")\nif not src.exists():\n    raise SystemExit(\"Original manual-p15-beta.yml is required because it contains the P15 payload.\")\n\ntext = src.read_text(encoding=\"utf-8\")\nmarker = \"cat > /tmp/spiritualturkish-p15.b64 <<'P15_PAYLOAD'\"\nstart = text.find(marker)\nif start < 0:\n    raise SystemExit(\"Embedded P15 payload marker was not found.\")\n\nencoded = []\nfor line in text[start:].splitlines()[1:]:\n    if line.strip() == \"P15_PAYLOAD\":\n        break\n    encoded.append(line.strip())\n\nraw = base64.b64decode(\"\".join(encoded))\narchive = Path(\"/tmp/spiritualturkish-p15.zip\")\narchive.write_bytes(raw)\n\nout = Path(\"/tmp/spiritualturkish-p15\")\nout.mkdir(parents=True, exist_ok=True)\nwith zipfile.ZipFile(archive) as z:\n    z.extractall(out)\n\nif not (out / \"P15-apply.py\").exists():\n    raise SystemExit(\"Recovered P15 package is incomplete.\")\n\nprint(f\"\
        Recovered {len(raw)} bytes.\")"
    - name: Make cumulative installers migration-safe
      shell: python
      run: "from pathlib import Path\n\nroot = Path(\"/tmp/spiritualturkish-p15\")\n\ndef patch_one(filename):\n    p = root / filename\n    lines = p.read_text(encoding=\"utf-8\").splitlines()\n    out = []\n    removed = 0\n    i = 0\n\n    while i < len(lines):\n        line = lines[i]\n\n        # P6 has a comment + package guard around the global historical suite.\n        if filename == \"P6-apply.py\" and \"Run the existing unit suite if present\" in line:\n            indent = line[:len(line)-len(line.lstrip())]\n            out.append(indent + \"# Full cross-phase suite is deferred until P15.\")\n            removed += 1\n            while i < len(lines) and \"if cp.returncode:return cp.returncode\" not in lines[i]:\n                i += 1\n            if i < len(lines):\n                i += 1\n            continue\n\n        # P7-P14 each contain one all-tests glob that is inappropriate mid-migration.\n        if \"tests=sorted((root\" in line and \"glob(\" in line:\n        \
        \    indent = line[:len(line)-len(line.lstrip())]\n            out.append(indent + \"# Full cross-phase suite is deferred until P15.\")\n            removed += 1\n            same_line_run = \"subprocess.run\" in line\n            i += 1\n\n            if same_line_run and i < len(lines) and \"if cp.returncode\" in lines[i]:\n                i += 1\n            elif i < len(lines) and (\"run([node\" in lines[i] or \"cp=subprocess.run([node\" in lines[i]):\n                next_line = lines[i]\n                i += 1\n                if \"cp=subprocess.run\" in next_line and i < len(lines) and \"if cp.returncode\" in lines[i]:\n                    i += 1\n            continue\n\n        out.append(line)\n        i += 1\n\n    if removed != 1:\n        raise SystemExit(f\"{filename}: expected to defer exactly one global suite, changed {removed}.\")\n    p.write_text(\"\\n\".join(out) + \"\\n\", encoding=\"utf-8\")\n    print(\"Patched\", filename)\n\nfor filename in [f\"P{i}-apply.py\"\
        \ for i in range(6,15)]:\n    patch_one(filename)"
    - name: Migrate pre-P6 regression assumptions
      shell: python
      run: "from pathlib import Path\n\np = Path(\"tests/redesign.test.cjs\")\ns = p.read_text(encoding=\"utf-8\")\n\nrepls = [\n(\n\"test('declared chapters contain all 77 lessons exactly once and preserve curriculum order',()=>{\",\n\"test('declared chapters contain every base lesson exactly once and preserve curriculum order while allowing integrated extension lessons',()=>{\"\n),\n(\n\" assert.equal(catalog.courses.length,6);assert.equal(ordered.length,77);assert.equal(new Set(ordered).size,77);\",\n\" assert.equal(catalog.courses.length,6);assert.equal(new Set(ordered).size,ordered.length);const pron=ordered.filter(id=>id.startsWith('pron-'));assert([0,10].includes(pron.length),`unexpected pronunciation lesson count: ${pron.length}`);\"\n),\n(\n\" assert.deepEqual([...ordered].sort(),Array.from(c.ALL_LESSONS,l=>l.id).sort());\",\n\" assert.deepEqual([...ordered.filter(id=>!id.startsWith('pron-'))].sort(),Array.from(c.ALL_LESSONS,l=>l.id).sort());\"\n),\n(\n\" for(const course of catalog.courses){assert.deepEqual(Array.from(course.lessons),Array.from(c.ALL_LESSONS.filter(l=>l.track===course.id),l=>l.id));for(const\
        \ id of course.lessons){assert(catalog.chapterFor(id));assert.equal(catalog.forLesson(id).id,course.id);}}\",\n\" for(const course of catalog.courses){assert.deepEqual(Array.from(course.lessons).filter(id=>!id.startsWith('pron-')),Array.from(c.ALL_LESSONS.filter(l=>l.track===course.id),l=>l.id));for(const id of course.lessons){assert(catalog.chapterFor(id));assert.equal(catalog.forLesson(id).id,course.id);}}\"\n)\n]\n\nfor old, new in repls:\n    if old not in s:\n        raise SystemExit(\"redesign.test.cjs expected legacy assertion was not found: \" + old[:80])\n    s = s.replace(old, new, 1)\n\np.write_text(s, encoding=\"utf-8\")\n\np = Path(\"tests/browser.cjs\")\ns = p.read_text(encoding=\"utf-8\")\n\nold = \"const ids=await page.evaluate(()=>ALL_LESSONS.map(l=>l.id));assert.equal(ids.length,77);\"\nnew = \"const ids=await page.evaluate(()=>ALL_LESSONS.map(l=>l.id));assert.equal(ids.length,87);\"\nif old not in s:\n    raise SystemExit(\"browser.cjs legacy 77-lesson assertion\
        \ was not found.\")\ns = s.replace(old, new, 1)\ns = s.replace(\"console.log(`All 77 lessons rendered in ${l}.`);\", \"console.log(`All ${ids.length} lessons rendered in ${l}.`);\")\ns = s.replace(\n    \"console.log('PASS: 77 lessons, 82 reading routes, 24 workshops, EN/KO, four widths, completion, backups, migration, review, prayer drafts, keyboard, TTS and fallback.');\",\n    \"console.log(`PASS: ${ids.length} lessons, 82 reading routes, 24 workshops, EN/KO, four widths, completion, backups, migration, review, prayer drafts, keyboard, TTS and fallback.`);\"\n)\np.write_text(s, encoding=\"utf-8\")\n\nprint(\"Migrated catalog/browser regression assumptions.\")"
    - name: Verify base regression test
      run: node --test tests/redesign.test.cjs
    - name: Apply P2-P15 cumulatively
      run: python /tmp/spiritualturkish-p15/P15-apply.py --repo "$GITHUB_WORKSPACE"
    - name: Show final evidence
      shell: bash
      run: 'echo "Final automated test evidence:"

        node -e "const x=require(''./release-evidence/automated-tests.json''); console.log(x.status); if(x.status!==''pass''){console.log(x.stdout);console.error(x.stderr)}"

        npm run release:evidence

        npm run release:certify

        echo "P15 certification:"

        cat release-certification/decision.txt'
    - name: Prepare beta branch
      id: branch
      shell: bash
      run: 'BRANCH="release/p15-beta-${{ github.run_number }}-v3"

        echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

        git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git switch -c "$BRANCH"

        git rm -f .github/workflows/manual-p15-beta.yml || true

        git rm -f .github/workflows/manual-p15-beta-v2.yml || true

        git rm -f .github/workflows/manual-p15-beta-v3.yml || true

        rm -f field-test/results/*.json field-test/results/*.csv 2>/dev/null || true

        git add -A

        git status --short

        git commit -m "feat: apply SpiritualTurkish P2-P15 beta candidate"'
    - name: Push beta branch
      run: git push --set-upstream origin "${{ steps.branch.outputs.name }}"
    - name: Open pull request
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ steps.branch.outputs.name }}
      shell: bash
      run: "DECISION=\"$(cat release-certification/decision.txt | tr -d '\\r\\n')\"\nTESTS=\"$(node -e \"console.log(require('./release-evidence/automated-tests.json').status)\")\"\ngh pr create \\\n  --base main \\\n  --head \"$BRANCH\" \\\n  --title \"SpiritualTurkish P15 beta candidate\" \\\n  --body \"Applies the cumulative P2-P15 candidate.\n\nFinal automated unit/data evidence: **$TESTS**\nCurrent P15 certification: **$DECISION**\n\nThis remains a beta candidate until the real P13 specialist and P14 field-test gates are completed.\""
    - name: Summary
      shell: bash
      run: "{\n  echo \"## SpiritualTurkish P15 v3\"\n  echo\n  echo \"**Branch:** `${{ steps.branch.outputs.name }}`\"\n  echo\n  echo \"**Automated tests:** `$(node -e \"console.log(require('./release-evidence/automated-tests.json').status)\")`\"\n  echo\n  echo \"**P15 certification:** `$(cat release-certification/decision.txt | tr -d '\\r\\n')`\"\n} >> \"$GITHUB_STEP_SUMMARY\""
# trigger-after-actions-enabled
